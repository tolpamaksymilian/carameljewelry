# Netlify — publikacja statycznego eksportu Next.js (plan Free, bez funkcji serwerowych)

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # Wyłącza automatyczny adapter Next.js (OpenNext). Strona jest w pełni statyczna,
  # więc Netlify ma tylko opublikować folder `out/` — bez SSR i funkcji serverless.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  NEXT_TELEMETRY_DISABLED = "1"

# Strona 404:
# Netlify automatycznie serwuje `out/404.html` ze statusem HTTP 404 dla każdego
# nieistniejącego adresu. Celowo NIE ma tu przekierowania „/* -> /index.html”.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Zasoby z hashem w nazwie — można je cache'ować „na zawsze”.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
