# Netlify — publikacja statycznego eksportu Next.js (plan Free)
# Jedyna funkcja serwerowa: netlify/functions/publikuj.mts („Zapisz stronę” w panelu /admin).

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # Wyłącza automatyczny adapter Next.js (OpenNext). Strona jest w pełni statyczna,
  # więc Netlify ma tylko opublikować folder `out/` — bez SSR.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  NEXT_TELEMETRY_DISABLED = "1"

[functions]
  directory = "netlify/functions"

# Dawny adres podglądu pełnej strony (przed startem) prowadzi na stronę główną.
[[redirects]]
  from = "/podglad"
  to = "/"
  status = 301

# Strona 404:
# Netlify automatycznie serwuje `out/404.html` ze statusem HTTP 404 dla każdego
# nieistniejącego adresu. Celowo NIE ma tu przekierowania „/* -> /index.html”.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    # Skąd strona może ładować zasoby: tylko z własnej domeny i z Supabase (panel /admin).
    # 'unsafe-inline' jest potrzebne, bo statyczny eksport Next.js osadza skrypty i style w HTML.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://lgamicpzemmrtbylmpiv.supabase.co; font-src 'self'; connect-src 'self' https://lgamicpzemmrtbylmpiv.supabase.co; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

# Zasoby z hashem w nazwie — można je cache'ować „na zawsze”.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Panel admina: bez cache przeglądarki i bez osadzania w ramkach.
[[headers]]
  for = "/admin*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
